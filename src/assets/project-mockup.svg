<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#172a45" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00efff" />
      <stop offset="100%" stop-color="#7b2fff" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 238, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Glowing Orbs -->
  <circle cx="200" cy="150" r="120" fill="#00efff" opacity="0.08" filter="blur(40px)" />
  <circle cx="600" cy="350" r="140" fill="#7b2fff" opacity="0.08" filter="blur(50px)" />

  <!-- Code / Mockup wireframe -->
  <rect x="80" y="60" width="640" height="380" rx="12" fill="rgba(23, 42, 69, 0.6)" stroke="rgba(0, 238, 255, 0.15)" stroke-width="1.5" style="backdrop-filter: blur(10px);" />
  
  <!-- Browser window dots -->
  <circle cx="110" cy="85" r="6" fill="#ff5f56" />
  <circle cx="130" cy="85" r="6" fill="#ffbd2e" />
  <circle cx="150" cy="85" r="6" fill="#27c93f" />

  <!-- Mockup lines -->
  <rect x="190" y="80" width="420" height="10" rx="5" fill="rgba(0, 238, 255, 0.08)" />
  
  <!-- Simulated Code lines -->
  <rect x="120" y="140" width="180" height="8" rx="4" fill="#00efff" opacity="0.4" />
  <rect x="120" y="165" width="320" height="8" rx="4" fill="#7b2fff" opacity="0.4" />
  <rect x="150" y="190" width="240" height="8" rx="4" fill="rgba(255, 255, 255, 0.2)" />
  <rect x="150" y="215" width="280" height="8" rx="4" fill="#00efff" opacity="0.4" />
  <rect x="120" y="240" width="90" height="8" rx="4" fill="#ffbd2e" opacity="0.4" />
  
  <!-- Floating Dashboard UI Card -->
  <rect x="420" y="220" width="240" height="150" rx="10" fill="rgba(10, 25, 47, 0.85)" stroke="url(#neonCyan)" stroke-width="1.5" />
  <circle cx="470" cy="270" r="20" fill="url(#neonCyan)" opacity="0.8" />
  <rect x="510" y="260" width="110" height="8" rx="4" fill="rgba(255, 255, 255, 0.7)" />
  <rect x="510" y="275" width="70" height="6" rx="3" fill="rgba(255, 255, 255, 0.4)" />
  <line x1="440" y1="320" x2="640" y2="320" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  <rect x="440" y="335" width="140" height="6" rx="3" fill="#00efff" opacity="0.5" />

  <text x="400" y="475" font-family="'Poppins', sans-serif" font-size="16" fill="rgba(255, 255, 255, 0.3)" font-weight="600" text-anchor="middle" letter-spacing="2">ACTIVE REPOSITORY</text>
</svg>
